# Dark Flip: builds ReSkate (Dingo-Shenanigans/ReSkate) with the Dark Flip patch applied and packs
# just the two files people copy over their ReSkate folder: ReSkate.dll and ReSkateLauncher.exe.
# The patch is embedded below, so this one file is the whole repo's build.
#
# Dark Flip 1.0.0 on ReSkate 2.1.2: body flips out of a dark catch. On by default.
#   Catch any flip trick dark, then press and hold LT or RT with the left stick up or down: the game's own
#   body flip starts (its spin assist, its height rule), with no grab pose. Stick down = backflip, up =
#   frontflip. Toggle: SANDBOX > TUNE > TRICKLINING > DARK FLIP, or "darkflip on|off" (kept between launches).
#   How: a hook on the game's bool state setter (Skate+0x11dd7a0, checked byte for byte first) keeps the grab
#   intent on in a dark catch and sets the flip direction from the stick. Research tools, off by default:
#   "darkflip probe on" (per-step CSVs in logs) and "darkflip watch on" (watchpoints, 60 s).
#   The Spotify helper is left out of the build (as in Grab Fix).
name: Build Dark Flip

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: ReSkate tag to build on
        default: v2.1.2
        required: true
      reskate_version:
        description: Version stamped into the binaries (the ReSkate release it is built on)
        default: 2.1.2
        required: true
      release:
        description: Also publish a GitHub release with the zip
        type: boolean
        default: false

permissions:
  contents: write

env:
  DARK_FLIP_VERSION: 1.0.0
  PATCH_SHA256: BF9E5C85ACDD660F4B442A9BB64D4E4A860A7F11E6612116757BEA4C32C8978B

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Get ReSkate ${{ inputs.upstream_ref }}
        uses: actions/checkout@v4
        with:
          repository: Dingo-Shenanigans/ReSkate
          ref: ${{ inputs.upstream_ref }}
          path: ReSkate

      # No GitHub expression (dollar sign + double braces) may appear in this step's run block: GitHub would evaluate the whole
      # block (the embedded patch) as one expression, which is capped at 21000 characters.
      - name: Apply the Dark Flip patch
