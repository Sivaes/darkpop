name: Build ReSkate Trainer Tournament Edition on ReSkate 2.1.0 (tester zip)

# One-file build of ReSkate Trainer 0.8.1 Tournament Edition (no No Bail toggle, no game speed; everything else stays): Nakas's trainer 0.7.1 (andrewnakas/reskate-trainer, the ReSkate 2.0.9 build)
# merged onto ReSkate 2.1.0, with Dark Pop 3.3 and Revert Boost 2.0 (Sivaes/darkpop).
# 0.8.1 = Dark Pop 3.3, the graph floor: the pop's time is also written into the animation graph's own countdown slot,
# so a pop after a soft flat-ground landing (the game's jump fires early) can still take a flip. Log line "Dark Pop graph floor". ReSkate 2.1.0 carries the trainer
# itself as its SANDBOX page (0.3.0 level); this build puts the 0.4-0.7 trainer on top and names the page PHYSICS again.
# The patch (a diff against ReSkate v2.1.0) and the package files are embedded below, so this file can be added to any
# GitHub repository from a phone. ReSkate's source is fetched when it runs. Actions > Run workflow, then download the
# zip from the run's Artifacts. The zip is lean: ReSkate.dll, ReSkateLauncher.exe, the license and a note.
# 0.8.0 compiled and ran on 18 Oct; the 0.8.1 change is not compiled or play tested before it was handed over.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: ReSkate version to build on (a release tag)
        required: true
        default: v2.1.0
      mod_version:
        description: Trainer version for this build, x.y.z
        required: true
        default: 0.8.1
      full_package:
        description: Also build the Mods-folder package (Install.bat, manifest, changelog, icon) for the launcher's MODS tab
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      UPSTREAM_REF: ${{ inputs.upstream_ref }}
      MOD_VERSION: ${{ inputs.mod_version }}

    steps:
      - name: Keep line endings as they are
        run: git config --global core.autocrlf false

