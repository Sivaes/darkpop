          $bytes = [Convert]::FromBase64String(($b64 -replace '\s', ''))
          $hash = (Get-FileHash -InputStream ([IO.MemoryStream]::new($bytes)) -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '325f8fda68f5f86e0b000731ddf5b452eacffddd3e553f9f6c5118991711f816') { throw "The embedded mod files are damaged (copy-paste cut something off). Paste the whole file again." }
