name: Build ReSkate Trainer Tournament Edition on ReSkate 2.1.1 (tester zip)

# One-file build of ReSkate Trainer 0.9.1 Tournament Edition (no No Bail toggle, no game speed; everything else stays): Nakas's trainer 0.7.1 (andrewnakas/reskate-trainer, the ReSkate 2.0.9 build)
# merged onto ReSkate 2.1.1, with Dark Flip 1.0.1 and Dark Pop 3.4 (Sivaes/darkpop) and Grab Fix 0.4.0 (Sivaes/grabbugs).
# 0.9.1 (24 Oct 2026): Dark Flip 1.0.1: native PlayStation pads (DualSense / DualShock 4 without Steam Input or DS4Windows)
#   work: when the game's own controller reads are not seen, Dark Flip reads the pad through ReSkate's direct PlayStation reader.
# 0.9.0 (24 Oct 2026): Dark Flip 1.0.0, on by default (PHYSICS > TUNE > TRICKLINING > DARK FLIP, console "darkflip"): body flips out
#   of a dark catch. Catch a flip dark, press and hold LT or RT with the left stick up or down: the game's own body flip starts,
#   no grab pose; stick down = backflip, up = frontflip. Through a hook on the game's bool state setter (Skate+0x11dd7a0, checked
#   byte for byte). Grab Fix keeps its gamepad observer; Dark Flip gets a second one (DingoSDKOverlaySetGamepadObserver2). No Bail's
#   step listener slots 4 -> 6. Dark Flip 1.0.0 is not play-tested yet (0.3.1, the same fix without the direction/readiness
#   changes, was); the merge passes a MinGW syntax check and the patch rebuilds the merged tree exactly from v2.1.1.
# 0.8.5 (23 Oct 2026): Revert Boost 2.0 taken out (it doubled up with TRICKLINING's board bending boost, which stays).
#   The REVERT BOOST card, the SKATER page toggle and its saved setting are gone; nothing else changes from 0.8.4.
# 0.8.4 (22 Oct 2026): Grab Fix 0.4.0, on by default (Insert > Addons > GRAB FIX, console "grabfix"):
#   Sticky Grab: letting go of the trigger ends the grab, as for airwalks/tailwalks (grab + B): a grab the game keeps on 50 ms
#     after its trigger is let go is ended there ("grabfix release off|on", "grabfix release delay <ms>"). Legacy footplants kept on.
#   Grab Swap: the grab type a bail or reset leaves set is put back to 0 while off the board ("grabfix clear off|on").
#   One ReSkate.log line each time a fix acts. The test builds' probes are gone; the signal check is off ("grabfix check on" for a
#   bug report); the old bail guard is off ("grabfix guard on"). Grab Fix settings start from the defaults once.
# No Bail is unreachable: the console refuses it, the bind rows hide it, a bind cannot be set, and a saved No Bail bind does nothing.
# The patch (a diff against ReSkate v2.1.1) and the package files are embedded below, so this file can be added to any
# GitHub repository from a phone. ReSkate's source is fetched when it runs. Actions > Run workflow, then download the
# zip from the run's Artifacts. The zip is lean: ReSkate.dll, ReSkateLauncher.exe, the license and a note.
# Grab Fix 0.3.8 (the same two fixes plus the probes) compiled and was played on 22 Oct (Xbox pad, and a PS4 pad through XInput).
# 0.4.0 is that code with the probes taken out; it passes a clang syntax check but is not compiled or played before being handed over.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: ReSkate version to build on (a release tag)
        required: true
        default: v2.1.1
      mod_version:
        description: Trainer version for this build, x.y.z
        required: true
        default: 0.9.1
      full_package:
        description: Also build the Mods-folder package (Install.bat, manifest, changelog, icon) for the launcher's MODS tab
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      UPSTREAM_REF: ${{ inputs.upstream_ref }}
      MOD_VERSION: ${{ inputs.mod_version }}

    steps:
      - name: Keep line endings as they are
