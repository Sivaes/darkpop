          [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE/payload.tgz", $bytes)
          tar -xzf "$env:GITHUB_WORKSPACE/payload.tgz" -C mod
          Get-ChildItem mod -Recurse -File -Name

      - name: Check out the trainer
        uses: actions/checkout@v7
        with:
          repository: andrewnakas/reskate-trainer
          ref: ${{ env.TRAINER_REF }}
          path: src
          persist-credentials: false

      - name: Work out the versions
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:MOD_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'mod_version must look like 0.6.2' }
          # The trainer is a build of ReSkate: its ReSkate version is in its own release notes. 2.0.7 for v0.6.0.
          $base = '2.0.7'
          $notes = Get-Content -Raw src/Extension/Trainer/CHANGELOG.md
          if ($notes -match 'Built on ReSkate (\d+\.\d+\.\d+)') { $base = $Matches[1] }
          "BASE_VERSION=$base" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "ReSkate Trainer $env:MOD_VERSION on $env:TRAINER_REF (ReSkate $base) + Dark Pop 3.0" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Apply the patch
        working-directory: src
        run: |
          $patch = Join-Path $env:GITHUB_WORKSPACE 'mod/patches/trainer-dark-pop-3.patch'
          git apply --ignore-whitespace --check $patch
          if ($LASTEXITCODE -ne 0) { throw "The patch does not fit reskate-trainer $env:TRAINER_REF. It was made for v0.6.0; a newer trainer changed a file it edits and the patch needs rebasing." }
          git apply --ignore-whitespace $patch
          if ($LASTEXITCODE -ne 0) { throw 'The patch failed to apply.' }
          Write-Host 'Applied patches/trainer-dark-pop-3.patch'
          git diff --stat | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Configure
        # A test zip never replaces itself. The build is labelled as the trainer in the log and crash reports.
        working-directory: src
        run: |
          $commit = '${{ github.sha }}'.Substring(0, 7)
          cmake --preset vs2022-x64 "-DDINGOSDK_VERSION=$env:BASE_VERSION" "-DDINGOSDK_MOD_ID=$env:MOD_NAME" "-DDINGOSDK_MOD_VERSION=$env:MOD_VERSION+$commit" -DDINGOSDK_LAUNCHER_AUTO_UPDATE=OFF

      - name: Build launcher and runtime
        working-directory: src
        run: cmake --build --preset release --parallel 4 --target dingosdk_launcher dingosdk_runtime

      - name: Package
        run: |
          $ErrorActionPreference = 'Stop'
          $ws = $env:GITHUB_WORKSPACE
          $release = "$ws/out/release"; $package = "$ws/out/package/ReSkate_Trainer"
          New-Item -ItemType Directory -Path $release, "$package/licenses" -Force | Out-Null
          Copy-Item "$ws/src/build/vs2022-x64/Release/ReSkate.dll", "$ws/src/build/vs2022-x64/Release/ReSkateLauncher.exe" -Destination $release
          Copy-Item "$ws/src/build/vs2022-x64/Release/ReSkate.pdb", "$ws/src/build/vs2022-x64/Release/ReSkateLauncher.pdb" -Destination $release -ErrorAction SilentlyContinue
          Copy-Item -Path "$ws/mod/package/*" -Destination $package -Recurse
          Copy-Item "$release/ReSkate.dll", "$release/ReSkateLauncher.exe" -Destination $package
          Copy-Item "$ws/src/LICENSE" -Destination "$package/LICENSE"
          foreach ($dir in Get-ChildItem "$ws/src/External" -Directory) {
            $file = Get-ChildItem $dir.FullName -File | Where-Object { $_.Name -match '^LICENSE(\.txt)?$' } | Select-Object -First 1
            if ($file) { Copy-Item $file.FullName "$package/licenses/$($dir.Name)-LICENSE.txt" }
          }
          Copy-Item "$ws/src/External/fonts/*-LICENSE.txt" "$package/licenses" -ErrorAction SilentlyContinue
          $manifestPath = "$package/manifest.json"
          $manifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
          $manifest.version_number = $env:MOD_VERSION
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM $manifestPath
          foreach ($file in 'Install.bat', 'INSTALL.txt') {
            $path = "$package/$file"
            (Get-Content -Raw $path).Replace('@MOD@', $env:MOD_VERSION) | Set-Content -NoNewline -Encoding utf8NoBOM $path
          }
          $zip = "$release/ReSkate_Trainer-$env:MOD_VERSION.zip"
          Compress-Archive -Path "$ws/out/package/ReSkate_Trainer" -DestinationPath $zip -Force
          $lines = foreach ($f in "$release/ReSkate.dll", "$release/ReSkateLauncher.exe", $zip) { "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())  $(Split-Path $f -Leaf)" }
          $lines | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $lines

      - name: Upload the zip
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MOD_NAME }}-${{ inputs.mod_version }}-darkpop3-on-${{ inputs.trainer_ref }}
          path: out/release/ReSkate_Trainer-${{ inputs.mod_version }}.zip

      - name: Upload the symbols (for reading a crash)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MOD_NAME }}-${{ inputs.mod_version }}-symbols
          path: |
            out/release/ReSkate.pdb
            out/release/ReSkateLauncher.pdb
          if-no-files-found: ignore
