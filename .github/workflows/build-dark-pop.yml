      - name: Find the ReSkate version
        run: |
          $ErrorActionPreference = 'Stop'
          $want = "$env:UPSTREAM_REF".Trim()
          $lines = git ls-remote --tags --refs https://github.com/Dingo-Shenanigans/ReSkate.git
          if ($LASTEXITCODE -ne 0) { throw 'Could not reach github.com/Dingo-Shenanigans/ReSkate to list its versions.' }
          $tags = @($lines | ForEach-Object { ($_ -split 'refs/tags/')[1] } | Where-Object { $_ })
          if ($want -eq 'main') { $found = 'main' }
          elseif ($tags -contains $want) { $found = $want }
          elseif ($tags -contains "v$want") { $found = "v$want" }
          else {
            $recent = ($tags | Select-Object -Last 15) -join ', '
            throw "ReSkate has no version called '$want'. Use 'main' or one of its release tags. Latest tags: $recent"
          }
          "Building on ReSkate: $found"
          "RESOLVED_REF=$found" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Check out ReSkate
        uses: actions/checkout@v7
        with:
          repository: Dingo-Shenanigans/ReSkate
          ref: ${{ env.RESOLVED_REF }}
          path: src
          persist-credentials: false

      - name: Work out the versions
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:MOD_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'mod_version must look like 0.8.4' }
          if ($env:RESOLVED_REF -match '^v?(\d+\.\d+\.\d+)$') { $base = $Matches[1]; $label = $base } else { $base = '0.0.0'; $label = $env:RESOLVED_REF }
          "BASE_VERSION=$base" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "BASE_LABEL=$label" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # The build carries this name in the start-up notice, the log and crash reports.
          # Always the tournament edition: no No Bail toggle, no game speed.
          "MOD_NAME=ReSkate_Trainer_Tournament" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "TOURNAMENT=ON" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "ReSkate Trainer $env:MOD_VERSION Tournament Edition on ReSkate $label + Dark Flip 1.0.1 + Dark Pop 3.4 + Grab Fix 0.4.0" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Apply the patch
        working-directory: src
        run: |
          # One patch: the trainer, Dark Flip 1.0.1, Dark Pop 3.4 and Grab Fix 0.4.0 together, a diff against ReSkate v2.1.1.
          $patches = @('trainer-2.1.1.patch')
          foreach ($name in $patches) {
            $patch = Join-Path $env:GITHUB_WORKSPACE "mod/patches/$name"
            if (-not (Test-Path $patch)) {
              Write-Host 'Files in this repository:'
              Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'mod') -Recurse -File -Name | Where-Object { $_ -notlike '.git*' } | Select-Object -First 40
              throw "patches/$name is not in this repository. Upload the 'patches' folder from the zip so the file is at patches/$name."
            }
            git apply --ignore-whitespace --check $patch
            if ($LASTEXITCODE -ne 0) { throw "patches/$name is there but does not fit ReSkate $env:RESOLVED_REF. ReSkate changed a file the patch edits; the patch needs updating for this version." }
            git apply --ignore-whitespace $patch
            if ($LASTEXITCODE -ne 0) { throw "patches/$name failed to apply." }
            Write-Host "Applied patches/$name"
            "Applied patches/$name" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }

      - name: Fetch the Spotify helper's crates
        # ReSkate 2.1.0 links a Rust library (SpotifyHelper, the game as a Spotify Connect device) when cargo is on the
        # machine, and its cmake looks for a Windows import library in cargo's cache, which is only there once the
        # crates are fetched. Without the fetch the configure fails ("list GET given empty list"). If cargo cannot
        # fetch, the build goes on without the Spotify device, as on a machine without cargo.
        working-directory: src/SpotifyHelper
        run: |
          $skip = '0'
          if (Get-Command cargo -ErrorAction SilentlyContinue) {
            cargo fetch
            if ($LASTEXITCODE -ne 0) { $skip = '1'; Write-Host 'cargo fetch failed: building without the Spotify device.' }
          } else { $skip = '1'; Write-Host 'No cargo: building without the Spotify device.' }
          "SKIP_SPOTIFY=$skip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          if ($skip -eq '1') { "Built without the Spotify device (cargo missing or its fetch failed)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }

      - name: Configure
        # A test zip never replaces itself.
        # Crash reports stay on and go where ReSkate's go, labelled with this mod's name and version.
        working-directory: src
        run: |
          # The mod repository's commit goes after the version (0.2.1+abc1234), so the game's start-up notice and log
          # say exactly which build is running, and it can be matched to a commit in this repository.
          $commit = '${{ github.sha }}'.Substring(0, 7)
          "Mod repository commit: $commit" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $cmakeArgs = @('--preset', 'vs2022-x64', "-DDINGOSDK_VERSION=$env:BASE_VERSION", "-DDINGOSDK_MOD_ID=$env:MOD_NAME", "-DDINGOSDK_MOD_VERSION=$env:MOD_VERSION+$commit")
          $cmakeArgs += '-DDINGOSDK_LAUNCHER_AUTO_UPDATE=OFF'
          $cmakeArgs += "-DDINGOSDK_TOURNAMENT=$env:TOURNAMENT"
          if ($env:SKIP_SPOTIFY -eq '1') { $cmakeArgs += '-DDINGOSDK_CARGO=DINGOSDK_CARGO-NOTFOUND' }
          cmake @cmakeArgs

      - name: Build launcher and runtime
        working-directory: src
        run: cmake --build --preset release --parallel 4 --target dingosdk_launcher dingosdk_runtime

      - name: Package
        run: |
          $ErrorActionPreference = 'Stop'
          $ws = $env:GITHUB_WORKSPACE
          $release = "$ws/out/release"; $lean = "$ws/out/lean"; $package = "$ws/out/package"
          New-Item -ItemType Directory -Path $release, $lean -Force | Out-Null
          Copy-Item "$ws/src/build/vs2022-x64/Release/ReSkate.dll", "$ws/src/build/vs2022-x64/Release/ReSkateLauncher.exe" -Destination $release
          Copy-Item "$ws/src/build/vs2022-x64/Release/ReSkate.pdb", "$ws/src/build/vs2022-x64/Release/ReSkateLauncher.pdb" -Destination $release -ErrorAction SilentlyContinue
          # The lean zip: the two files that go in the ReSkate folder, the license and a note.
          Copy-Item "$release/ReSkate.dll", "$release/ReSkateLauncher.exe" -Destination $lean
          Copy-Item "$ws/src/LICENSE" -Destination "$lean/LICENSE.txt"
          @(
            "ReSkate Trainer $env:MOD_VERSION TOURNAMENT EDITION with Dark Flip 1.0.1, Dark Pop 3.4 and Grab Fix 0.4.0 (built on ReSkate $env:BASE_LABEL)"
            "Tournament edition: the No Bail toggle and the game speed are not available at all (no menu, console or keybind). The log says so at start-up."
            "Grab Fix 0.4.0 is on by default (Insert > Addons > GRAB FIX): Sticky Grab and Grab Swap fixed (grabfix status)."
            "Dark Flip 1.0.1 is on by default (Insert > PHYSICS > TUNE > TRICKLINING > DARK FLIP): in a dark catch, hold LT or RT with the stick up or down to body flip (darkflip status)."
            ""
            "Close the game and the ReSkate launcher, then copy ReSkate.dll and ReSkateLauncher.exe"
            "over the ones in your ReSkate folder (where ReSkateLauncher.exe lives). Keep copies of the originals."
            "Start ReSkateLauncher.exe as usual. In game: Insert > PHYSICS > TUNE > TRICKLINING > DARK POP."
            ""
            "Source (GPL-3.0): https://github.com/Dingo-Shenanigans/ReSkate, https://github.com/andrewnakas/reskate-trainer, https://github.com/Sivaes/darkpop and https://github.com/Sivaes/grabbugs"
          ) -join "`r`n" | Set-Content -NoNewline -Encoding utf8NoBOM "$lean/README.txt"
          $zip = "$release/$env:MOD_NAME-$env:MOD_VERSION.zip"
          Compress-Archive -Path "$lean/*" -DestinationPath $zip -Force
          $hashed = @("$release/ReSkate.dll", "$release/ReSkateLauncher.exe", $zip)
          if ('${{ inputs.full_package }}' -eq 'true') {
            New-Item -ItemType Directory -Path "$package/licenses" -Force | Out-Null
            Copy-Item -Path "$ws/mod/package/*" -Destination $package -Recurse
            Copy-Item "$release/ReSkate.dll", "$release/ReSkateLauncher.exe" -Destination $package
            Copy-Item "$ws/src/LICENSE" -Destination "$package/LICENSE.txt"
            foreach ($dir in Get-ChildItem "$ws/src/External" -Directory) {
              $file = Get-ChildItem $dir.FullName -File | Where-Object { $_.Name -match '^LICENSE(\.txt)?$' } | Select-Object -First 1
              if ($file) { Copy-Item $file.FullName "$package/licenses/$($dir.Name)-LICENSE.txt" }
            }
            Copy-Item "$ws/src/External/fonts/*-LICENSE.txt" "$package/licenses" -ErrorAction SilentlyContinue
            $manifestPath = "$package/manifest.json"
            $manifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
            $manifest.version_number = $env:MOD_VERSION
            $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM $manifestPath
            foreach ($file in 'Install.bat', 'INSTALL.txt') {
              $path = "$package/$file"
              (Get-Content -Raw $path).Replace('@MOD@', $env:MOD_VERSION).Replace('@BASE@', $env:BASE_LABEL) | Set-Content -NoNewline -Encoding utf8NoBOM $path
            }
            $full = "$release/$env:MOD_NAME-$env:MOD_VERSION-mods-folder.zip"
            Compress-Archive -Path "$package/*" -DestinationPath $full -Force
            $hashed += $full
          }
          $lines = foreach ($f in $hashed) { "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())  $(Split-Path $f -Leaf)" }
          $lines | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $lines

      - name: Upload the zip
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MOD_NAME }}-${{ inputs.mod_version }}-on-${{ inputs.upstream_ref }}
          path: |
            out/release/${{ env.MOD_NAME }}-${{ inputs.mod_version }}.zip
            out/release/${{ env.MOD_NAME }}-${{ inputs.mod_version }}-mods-folder.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload the symbols (for reading a crash)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MOD_NAME }}-${{ inputs.mod_version }}-symbols
          path: |
            out/release/ReSkate.pdb
            out/release/ReSkateLauncher.pdb
          if-no-files-found: ignore
          retention-days: 30
