          $bytes = [Convert]::FromBase64String(($b64 -replace '\s', ''))
          $hash = (Get-FileHash -InputStream ([IO.MemoryStream]::new($bytes)) -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '21d4a5bb09fb8cb92933985c35c15c1714c8d08cfb8388f37f009667087ed8c0') { throw "The embedded mod files are damaged (copy-paste cut something off). Paste the whole file again." }
