name: Build Dark Pop (tester zip)

# One-file build of ReSkate Dark Pop 1.6.0: the patch and the package files are embedded in this file, so it can
# be added to any GitHub repository from a phone (Add file > Create new file). ReSkate's source is fetched from
# the ReSkate project when it runs. Actions > Build Dark Pop (tester zip) > Run workflow, then download the zip
# from the run's Artifacts.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: ReSkate version to build on (a release tag)
        required: true
        default: v1.1.1
      mod_version:
        description: Dark Pop version, x.y.z
        required: true
        default: 1.6.0

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      UPSTREAM_REF: ${{ inputs.upstream_ref }}
      MOD_VERSION: ${{ inputs.mod_version }}

    steps:
      - name: Keep line endings as they are
        run: git config --global core.autocrlf false

      - name: Unpack the mod files (embedded below)
