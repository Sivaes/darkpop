          $bytes = [Convert]::FromBase64String(($b64 -replace '\s', ''))
          $hash = (Get-FileHash -InputStream ([IO.MemoryStream]::new($bytes)) -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '24aaca540e1ab030fc029832859ece6091b9cace45fb23667af09fa3b165e761') { throw "The embedded files are damaged (copy-paste cut something off). Paste the whole file again." }
