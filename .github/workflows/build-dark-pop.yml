name: Build ReSkate Trainer Tournament Edition on ReSkate 2.1.1 (tester zip)

# One-file build of ReSkate Trainer 0.8.3 Tournament Edition (no No Bail toggle, no game speed; everything else stays): Nakas's trainer 0.7.1 (andrewnakas/reskate-trainer, the ReSkate 2.0.9 build)
# merged onto ReSkate 2.1.1, with Dark Pop 3.4, Revert Boost 2.0 (Sivaes/darkpop) and Grab Fix 0.3.1 (Sivaes/grabbugs).
# 0.8.3 (20 Oct 2026): built on ReSkate 2.1.1 instead of 2.1.0. Grab Fix 0.3.1 is in and on by default (Addons > GRAB FIX): the
# legacy footplants kept on (Sticky Grab) and the bail guard (Grab Swap). 0.3.1: off the board the guard no longer keeps the trigger
# held (that rolled the skater on foot after a reset); from a bail or reset it is let go, and on the first riding step the game reads it
# pressed for a couple of physics steps ("grabfix guard tap <steps>", default 2), the on-board release that clears the bug. A footplant
# keeps the hold until riding. "grabfix guard mode hold" is 0.2.1's behaviour. The grab probe is gone
# (nothing written to disk but the settings file and ReSkate.log). No Bail is unreachable: the console refuses it, the bind rows
# hide it, a bind cannot be set, and a saved No Bail bind does nothing.
# The patch (a diff against ReSkate v2.1.1) and the package files are embedded below, so this file can be added to any
# GitHub repository from a phone. ReSkate's source is fetched when it runs. Actions > Run workflow, then download the
# zip from the run's Artifacts. The zip is lean: ReSkate.dll, ReSkateLauncher.exe, the license and a note.
# 0.8.2 compiled and ran on 19 Oct (grab fix 0.2.1 too); the 0.8.3 changes (ReSkate 2.1.1, grab fix 0.3.1, No Bail lockout) pass a clang
# syntax check but are not compiled or play tested before being handed over. Test: bail with RT held, reset, walk, mount, tweak + grab.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: ReSkate version to build on (a release tag)
        required: true
        default: v2.1.1
      mod_version:
        description: Trainer version for this build, x.y.z
        required: true
        default: 0.8.3
      full_package:
        description: Also build the Mods-folder package (Install.bat, manifest, changelog, icon) for the launcher's MODS tab
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      UPSTREAM_REF: ${{ inputs.upstream_ref }}
      MOD_VERSION: ${{ inputs.mod_version }}

    steps:
      - name: Keep line endings as they are
        run: git config --global core.autocrlf false

