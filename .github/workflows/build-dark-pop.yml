name: Build Dark Pop (tester zip)

# One-file build of ReSkate Dark Pop 3.2 (with Revert Boost 2.0) on ReSkate 2.1.0: the patch and the package files are
# embedded in this file, so it can be added to any GitHub repository from a phone (Add file > Create new file). ReSkate's
# source is fetched from the ReSkate project when it runs. Actions > Build Dark Pop (tester zip) > Run workflow, then
# download the zip from the run's Artifacts. The zip is lean: ReSkate.dll, ReSkateLauncher.exe, the license and a note.
# Drop the two files over the ones in your ReSkate folder. Tick full_package for the Mods-folder layout as well.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: ReSkate version to build on (a release tag)
        required: true
        default: v2.1.0
      mod_version:
        description: Dark Pop version, x.y.z
        required: true
        default: 3.2.0
      full_package:
        description: Also build the Mods-folder package (Install.bat, manifest, changelog, icon) for the launcher's MODS tab
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      UPSTREAM_REF: ${{ inputs.upstream_ref }}
      MOD_VERSION: ${{ inputs.mod_version }}

    steps:
      - name: Keep line endings as they are
        run: git config --global core.autocrlf false

