name: Build ReSkate Trainer Tournament Edition on ReSkate 2.1.1 (tester zip)

# One-file build of ReSkate Trainer 0.8.3 Tournament Edition (no No Bail toggle, no game speed; everything else stays): Nakas's trainer 0.7.1 (andrewnakas/reskate-trainer, the ReSkate 2.0.9 build)
# merged onto ReSkate 2.1.1, with Dark Pop 3.4, Revert Boost 2.0 (Sivaes/darkpop) and Grab Fix 0.3.6 (Sivaes/grabbugs).
# 0.8.3 (20 Oct 2026): built on ReSkate 2.1.1 instead of 2.1.0. Grab Fix 0.3.6 is in and on by default (Addons > GRAB FIX): the
# legacy footplants kept on (Sticky Grab) and the clear (Grab Swap; the bail guard is off by default). 0.3.2: the guard keeps the trigger held through the wipeout
# and the respawn and lets it go on the first riding step (0.2.1), but never on foot (that rolled the skater): there it is let go, and on
# the first riding steps after the mount, right stick centred, the game reads it pressed for a few physics steps and let go instead
# ("grabfix guard tap <steps>", default 15; "grabfix guard mode hold" keeps the hold on foot too). 21 Oct log: 0.3.1's tap alone, right
# after a reset, only sometimes cleared the bug. 0.3.3 (test build): a read-only signal check is on ("grabfix check off"), a ReSkate.log
# line per change of the game's grab signals, trick request and latch; 0.3.4 adds "Grab source" lines
# (where the game reads its grab type from; "grabfix check source"). 0.3.5: the clear (on, "grabfix clear off"): the grab type
# a bail leaves set is put back to 0 while off the board; the bail guard is off by default. 0.3.6: check lines carry
# their time (@ms) and every trigger change during a grab is traced (Sticky Grab). The grab probe is gone
# (nothing written to disk but the settings file and ReSkate.log). No Bail is unreachable: the console refuses it, the bind rows
# hide it, a bind cannot be set, and a saved No Bail bind does nothing.
# The patch (a diff against ReSkate v2.1.1) and the package files are embedded below, so this file can be added to any
# GitHub repository from a phone. ReSkate's source is fetched when it runs. Actions > Run workflow, then download the
# zip from the run's Artifacts. The zip is lean: ReSkate.dll, ReSkateLauncher.exe, the license and a note.
# 0.8.2 compiled and ran on 19 Oct (grab fix 0.2.1 too); 0.8.3 with grab fix 0.3.3 compiled and ran on 21 Oct. Grab fix 0.3.4's source probe ran on 21 Oct; 0.3.5's clear ran and worked on 21 Oct; 0.3.6's logging passes a clang
# syntax check but is not compiled or play tested before being handed over. Test: bail with RT held, reset, walk, mount, tweak + grab.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: ReSkate version to build on (a release tag)
        required: true
        default: v2.1.1
      mod_version:
        description: Trainer version for this build, x.y.z
        required: true
        default: 0.8.3
      full_package:
        description: Also build the Mods-folder package (Install.bat, manifest, changelog, icon) for the launcher's MODS tab
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      UPSTREAM_REF: ${{ inputs.upstream_ref }}
      MOD_VERSION: ${{ inputs.mod_version }}

    steps:
