name: Build ReSkate Trainer with Dark Pop 3.0 (tester zip)

# One-file build of ReSkate Trainer 0.6.3: the trainer (andrewnakas/reskate-trainer v0.6.0, ReSkate 2.0.7) with its
# Dark Pop replaced by Dark Pop 3.2 (Sivaes/darkpop: the 601-route "unpatch", one switch, and in the air the mouse and
# keyboard kept from the game so it can't drop into keyboard/mouse mode, where the Quick Drop radial picks the object
# browser; the D-pad always reaches the game, which 3.1's D-pad hide broke) and Revert Boost 2.0.
# The patch and the package files are embedded below, so this file can be added to any GitHub repository from a
# phone (Add file > Create new file > paste). The trainer's source is fetched when it runs.
# Actions > "Build ReSkate Trainer with Dark Pop 3.0" > Run workflow, then download the zip from the run's Artifacts.
#
# What went wrong in 0.5.0 / 0.6.0: the trainer took Sivaes/darkpop's stale patches/dark-pop.patch (the 0.4-era
# "auto release" that rewrote the game's XInput polls to time a D-pad Right release). That approach was abandoned,
# and with Steam's overlay answering XInput ahead of ReSkate it never acted ("0 controller reads by the game so far:
# the game is not reading this controller through XInput, so Dark Pop cannot act"). The real Dark Pop (3.0.x) only
# ever lived embedded in the darkpop repository's workflow file, not in patches/. This build carries that one.

on:
  workflow_dispatch:
    inputs:
      trainer_ref:
        description: reskate-trainer version to build on (a tag or branch of andrewnakas/reskate-trainer)
        required: true
        default: v0.6.0
      mod_version:
        description: Trainer version for this build, x.y.z
        required: true
        default: 0.6.3
      full_package:
        description: Also build the full Mods-folder package (Install.bat, manifest, changelog, icon) for the launcher's MODS tab
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      TRAINER_REF: ${{ inputs.trainer_ref }}
      MOD_VERSION: ${{ inputs.mod_version }}
      MOD_NAME: ReSkate_Trainer
    steps:
      - name: Keep line endings as they are
        run: git config --global core.autocrlf false

