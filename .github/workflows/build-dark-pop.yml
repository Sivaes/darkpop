          $bytes = [Convert]::FromBase64String(($b64 -replace '\s', ''))
          $hash = (Get-FileHash -InputStream ([IO.MemoryStream]::new($bytes)) -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '9487f976fedef9b52c5a1014ac3fb51810ee64a7dc8ed5181286c8ec105446ba') { throw "The embedded mod files are damaged (copy-paste cut something off). Paste the whole file again." }
